[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "project-manager"
version = "0.3.0"
description = "Local SQLite CLI to add, list, complete, and delete tasks."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Xu Jiaqi", email = "jiaqixu12138@gmail.com" }]
dependencies = ["click>=8.0.0", "rich>=13.0.0"]

[project.optional-dependencies]
dev = ["pytest>=7,<9", "build>=1,<2", "ruff>=0.6"]

[tool.hatch.build.targets.wheel]
packages = ["src/project_manager"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[project.scripts]
project-manager = "project_manager.cli:main"

[project.urls]
Homepage = "https://github.com/Master-626/project-manager"

[tool.ruff]
target-version = "py38"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
